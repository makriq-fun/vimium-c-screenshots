name: CI

on:
  push:
    branches: [ "master", "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (geometry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:geometry

  build-firefox:
    name: Build Firefox (MV2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run mv2-ff
      - name: Show outputs
        run: |
          echo "--- dist ---"
          find dist -maxdepth 2 -type f | sort | head -60
          echo "--- zips ---"
          find . -maxdepth 2 -name '*.zip' -exec ls -l {} \;
      - name: Validate manifest and package with web-ext
        run: |
          npm install --no-save web-ext@10.8.0
          npx web-ext lint --source-dir dist
      - name: Upload unpacked Firefox build
        uses: actions/upload-artifact@v4
        with:
          name: vimium-c-screenshots-firefox-unpacked
          path: dist
          if-no-files-found: error
      - name: Upload Firefox zip
        uses: actions/upload-artifact@v4
        with:
          name: vimium-c-screenshots-firefox-zip
          path: "**/*.zip"
          if-no-files-found: warn

  test-chromium:
    name: Browser E2E (Chromium, real clipboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the Chrome MV3 extension
        run: npm run chrome
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.65.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run screenshot E2E tests
        run: xvfb-run -a --server-args="-screen 0 1600x1200x24" node tests/e2e/run.js
      - name: Upload Chrome zip
        uses: actions/upload-artifact@v4
        with:
          name: vimium-c-screenshots-chrome-zip
          path: "**/*.zip"
          if-no-files-found: warn
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-e2e-failure
          path: tests/e2e/out
          if-no-files-found: ignore

  release:
    name: Release package
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ "unit-tests", "build-firefox", "test-chromium" ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect packages
        run: |
          mkdir -p release
          find artifacts -name '*.zip' -exec cp {} release/ \;
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
